<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Атом | Оригинальная таблица Менделеева</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #020408;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* ВЕРХНЯЯ ОБЛАСТЬ — таблица Менделеева (40% высоты) */
        .periodic-container {
            height: 40vh;
            background: rgba(3, 6, 12, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(70, 110, 160, 0.4);
            overflow-x: auto;
            overflow-y: auto;
            padding: 12px 20px;
            flex-shrink: 0;
        }
        .periodic-table {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: max-content;
        }
        /* Строка периода */
        .period-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        /* Пустая ячейка для отступов */
        .empty-cell {
            width: 70px;
            height: 70px;
            visibility: hidden;
        }
        .element-card {
            width: 70px;
            background: rgba(12, 18, 28, 0.85);
            border: 1px solid rgba(90, 130, 190, 0.45);
            border-radius: 8px;
            text-align: center;
            padding: 8px 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .element-card:hover {
            background: rgba(45, 80, 130, 0.95);
            border-color: #6a9eff;
            transform: scale(1.02);
            z-index: 2;
        }
        .element-card.active {
            background: #1e4070;
            border-color: #ffcd7e;
            box-shadow: 0 0 12px rgba(255,200,100,0.5);
        }
        .element-symbol {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e2ecff;
        }
        .element-number {
            font-size: 0.65rem;
            color: #9bb9f0;
            margin-top: 2px;
        }
        /* Специальные строки для лантаноидов и актиноидов */
        .lanthanide-row, .actinide-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            padding-left: 0px;
        }
        .lanthanide-label, .actinide-label {
            width: 70px;
            font-size: 0.7rem;
            color: #8aaee0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(20, 30, 45, 0.6);
            border-radius: 8px;
            font-weight: 500;
        }
        .period-row-title {
            width: 40px;
            font-size: 0.7rem;
            color: #8aaee0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* НИЖНЯЯ ОБЛАСТЬ — атом (60% высоты) */
        .atom-container {
            height: 60vh;
            position: relative;
            background: #010205;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Информационные панели */
        .info-panel {
            position: absolute;
            bottom: 12px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 5px 16px;
            border-radius: 28px;
            color: #bbd4ff;
            font-family: monospace;
            font-size: 12px;
            border-left: 2px solid #4f8eff;
            pointer-events: none;
            z-index: 10;
        }
        .element-name {
            position: absolute;
            bottom: 12px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 5px 18px;
            border-radius: 28px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #ffefc0;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255, 200, 100, 0.4);
        }
        /* Стили скроллбара */
        .periodic-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .periodic-container::-webkit-scrollbar-track {
            background: #0a0f1c;
        }
        .periodic-container::-webkit-scrollbar-thumb {
            background: #2a4a7a;
            border-radius: 5px;
        }
        /* Футер с авторством */
        .author-footer {
            position: fixed;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: rgba(150, 180, 210, 0.35);
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
            letter-spacing: 0.5px;
            background: transparent;
        }
        @media (max-width: 900px) {
            .element-card { width: 60px; }
            .empty-cell { width: 60px; }
            .element-symbol { font-size: 0.9rem; }
            .element-number { font-size: 0.55rem; }
            .period-row-title { width: 35px; font-size: 0.6rem; }
            .lanthanide-label, .actinide-label { width: 60px; font-size: 0.6rem; }
            .info-panel { font-size: 9px; bottom: 8px; left: 10px; }
            .element-name { font-size: 0.75rem; bottom: 8px; right: 12px; padding: 4px 12px; }
            .author-footer { font-size: 8px; bottom: 4px; }
        }
        @media (max-width: 700px) {
            .element-card { width: 50px; padding: 6px 2px; }
            .empty-cell { width: 50px; }
            .lanthanide-label, .actinide-label { width: 50px; font-size: 0.55rem; }
        }
    </style>
</head>
<body>
    <div class="periodic-container">
        <div class="periodic-table" id="periodicGrid"></div>
    </div>
    <div class="atom-container">
        <canvas id="atomCanvas"></canvas>
        <div class="info-panel" id="atomInfo">⚛️ Нажмите на элемент</div>
        <div class="element-name" id="elementName">Атомная модель</div>
    </div>
    <div class="author-footer">Ковалёв Максим 2026</div>

    <script>
        (function(){
            // ---------- ДАННЫЕ ЭЛЕМЕНТОВ с правильными периодами и группами ----------
            const elementsData = [
                // Период 1
                {Z:1, symbol:"H", name:"Водород", period:1, group:1},
                {Z:2, symbol:"He", name:"Гелий", period:1, group:18},
                // Период 2
                {Z:3, symbol:"Li", name:"Литий", period:2, group:1},
                {Z:4, symbol:"Be", name:"Бериллий", period:2, group:2},
                {Z:5, symbol:"B", name:"Бор", period:2, group:13},
                {Z:6, symbol:"C", name:"Углерод", period:2, group:14},
                {Z:7, symbol:"N", name:"Азот", period:2, group:15},
                {Z:8, symbol:"O", name:"Кислород", period:2, group:16},
                {Z:9, symbol:"F", name:"Фтор", period:2, group:17},

                {Z:11, symbol:"Na", name:"Натрий", period:3, group:1},

                {Z:13, symbol:"Al", name:"Алюминий", period:3, group:13},

                {Z:15, symbol:"P", name:"Фосфор", period:3, group:15},
                {Z:16, symbol:"S", name:"Сера", period:3, group:16},
                {Z:17, symbol:"Cl", name:"Хлор", period:3, group:17},
                {Z:18, symbol:"Ar", name:"Аргон", period:3, group:18},
                // Период 4
                {Z:19, symbol:"K", name:"Калий", period:4, group:1},
                {Z:20, symbol:"Ca", name:"Кальций", period:4, group:2},
                {Z:21, symbol:"Sc", name:"Скандий", period:4, group:3},
                {Z:22, symbol:"Ti", name:"Титан", period:4, group:4},
                {Z:23, symbol:"V", name:"Ванадий", period:4, group:5},
                {Z:24, symbol:"Cr", name:"Хром", period:4, group:6},
                {Z:25, symbol:"Mn", name:"Марганец", period:4, group:7},
                {Z:26, symbol:"Fe", name:"Железо", period:4, group:8},
                {Z:27, symbol:"Co", name:"Кобальт", period:4, group:9},

                {Z:29, symbol:"Cu", name:"Медь", period:4, group:11},

                {Z:33, symbol:"As", name:"Мышьяк", period:4, group:15},
                {Z:34, symbol:"Se", name:"Селен", period:4, group:16},
                {Z:35, symbol:"Br", name:"Бром", period:4, group:17},
                {Z:36, symbol:"Kr", name:"Криптон", period:4, group:18},
                // Период 5
                {Z:37, symbol:"Rb", name:"Рубидий", period:5, group:1},
                {Z:38, symbol:"Sr", name:"Стронций", period:5, group:2},
                {Z:39, symbol:"Y", name:"Иттрий", period:5, group:3},
                {Z:40, symbol:"Zr", name:"Цирконий", period:5, group:4},
                {Z:41, symbol:"Nb", name:"Ниобий", period:5, group:5},
                {Z:42, symbol:"Mo", name:"Молибден", period:5, group:6},
                {Z:43, symbol:"Tc", name:"Технеций", period:5, group:7},
                {Z:44, symbol:"Ru", name:"Рутений", period:5, group:8},
                {Z:45, symbol:"Rh", name:"Родий", period:5, group:9},
                {Z:46, symbol:"Pd", name:"Палладий", period:5, group:10},
                {Z:47, symbol:"Ag", name:"Серебро", period:5, group:11},
                {Z:48, symbol:"Cd", name:"Кадмий", period:5, group:12},
                {Z:49, symbol:"In", name:"Индий", period:5, group:13},
                {Z:50, symbol:"Sn", name:"Олово", period:5, group:14},
                {Z:51, symbol:"Sb", name:"Сурьма", period:5, group:15},
                {Z:52, symbol:"Te", name:"Теллур", period:5, group:16},
                {Z:53, symbol:"I", name:"Иод", period:5, group:17},
                {Z:54, symbol:"Xe", name:"Ксенон", period:5, group:18},
                // Период 6 (включая лантан)
                {Z:55, symbol:"Cs", name:"Цезий", period:6, group:1},
                {Z:56, symbol:"Ba", name:"Барий", period:6, group:2},
                {Z:57, symbol:"La", name:"Лантан", period:6, group:3},
                {Z:72, symbol:"Hf", name:"Гафний", period:6, group:4},
                {Z:73, symbol:"Ta", name:"Тантал", period:6, group:5},
                {Z:74, symbol:"W", name:"Вольфрам", period:6, group:6},
                {Z:75, symbol:"Re", name:"Рений", period:6, group:7},
                {Z:76, symbol:"Os", name:"Осмий", period:6, group:8},
                {Z:77, symbol:"Ir", name:"Иридий", period:6, group:9},
                {Z:78, symbol:"Pt", name:"Платина", period:6, group:10},
                {Z:79, symbol:"Au", name:"Золото", period:6, group:11},
                {Z:80, symbol:"Hg", name:"Ртуть", period:6, group:12},
                {Z:81, symbol:"Tl", name:"Таллий", period:6, group:13},
                {Z:82, symbol:"Pb", name:"Свинец", period:6, group:14},
                {Z:83, symbol:"Bi", name:"Висмут", period:6, group:15},
                {Z:84, symbol:"Po", name:"Полоний", period:6, group:16},
                {Z:85, symbol:"At", name:"Астат", period:6, group:17},
                {Z:86, symbol:"Rn", name:"Радон", period:6, group:18},
                // Период 7 (включая актиний)
                {Z:87, symbol:"Fr", name:"Франций", period:7, group:1},
                {Z:88, symbol:"Ra", name:"Радий", period:7, group:2},
                {Z:89, symbol:"Ac", name:"Актиний", period:7, group:3},
                {Z:104, symbol:"Rf", name:"Резерфордий", period:7, group:4},
                {Z:105, symbol:"Db", name:"Дубний", period:7, group:5},
                {Z:106, symbol:"Sg", name:"Сиборгий", period:7, group:6},
                {Z:107, symbol:"Bh", name:"Борий", period:7, group:7},
                {Z:108, symbol:"Hs", name:"Хассий", period:7, group:8},
                {Z:109, symbol:"Mt", name:"Мейтнерий", period:7, group:9},
                {Z:110, symbol:"Ds", name:"Дармштадтий", period:7, group:10},
                {Z:111, symbol:"Rg", name:"Рентгений", period:7, group:11},
                {Z:112, symbol:"Cn", name:"Коперниций", period:7, group:12},
                {Z:113, symbol:"Nh", name:"Нихоний", period:7, group:13},
                {Z:114, symbol:"Fl", name:"Флеровий", period:7, group:14},
                {Z:115, symbol:"Mc", name:"Московий", period:7, group:15},
                {Z:116, symbol:"Lv", name:"Ливерморий", period:7, group:16},
                {Z:117, symbol:"Ts", name:"Теннессин", period:7, group:17},
                {Z:118, symbol:"Og", name:"Оганесон", period:7, group:18}
            ];
            
            // Лантаноиды (58-71)
            const lanthanides = [
                {Z:58, symbol:"Ce", name:"Церий", period:6, group:3},
                {Z:59, symbol:"Pr", name:"Празеодим", period:6, group:3},
                {Z:60, symbol:"Nd", name:"Неодим", period:6, group:3},
                {Z:61, symbol:"Pm", name:"Прометий", period:6, group:3},
                {Z:62, symbol:"Sm", name:"Самарий", period:6, group:3},
                {Z:63, symbol:"Eu", name:"Европий", period:6, group:3},
                {Z:64, symbol:"Gd", name:"Гадолиний", period:6, group:3},
                {Z:65, symbol:"Tb", name:"Тербий", period:6, group:3},
                {Z:66, symbol:"Dy", name:"Диспрозий", period:6, group:3},
                {Z:67, symbol:"Ho", name:"Гольмий", period:6, group:3},
                {Z:68, symbol:"Er", name:"Эрбий", period:6, group:3},
                {Z:69, symbol:"Tm", name:"Тулий", period:6, group:3},
                {Z:70, symbol:"Yb", name:"Иттербий", period:6, group:3},
                {Z:71, symbol:"Lu", name:"Лютеций", period:6, group:3}
            ];
            // Актиноиды (90-103)
            const actinides = [
                {Z:90, symbol:"Th", name:"Торий", period:7, group:3},
                {Z:91, symbol:"Pa", name:"Протактиний", period:7, group:3},
                {Z:92, symbol:"U", name:"Уран", period:7, group:3},
                {Z:93, symbol:"Np", name:"Нептуний", period:7, group:3},
                {Z:94, symbol:"Pu", name:"Плутоний", period:7, group:3},
                {Z:95, symbol:"Am", name:"Америций", period:7, group:3},
                {Z:96, symbol:"Cm", name:"Кюрий", period:7, group:3},
                {Z:97, symbol:"Bk", name:"Берклий", period:7, group:3},
                {Z:98, symbol:"Cf", name:"Калифорний", period:7, group:3},
                {Z:99, symbol:"Es", name:"Эйнштейний", period:7, group:3},
                {Z:100, symbol:"Fm", name:"Фермий", period:7, group:3},
                {Z:101, symbol:"Md", name:"Менделевий", period:7, group:3},
                {Z:102, symbol:"No", name:"Нобелий", period:7, group:3},
                {Z:103, symbol:"Lr", name:"Лоуренсий", period:7, group:3}
            ];
            
            const allElements = [...elementsData, ...lanthanides, ...actinides];
            const elementsMap = new Map(allElements.map(el => [el.Z, el]));

            let currentZ = 1;
            const canvas = document.getElementById('atomCanvas');
            let ctx = canvas.getContext('2d');
            let width, height;
            let pixelRatio = window.devicePixelRatio || 1;
            let animationId = null;
            let globalTime = 0;
            let lastTimestamp = 0;

            let atomX = 0, atomY = 0;
            let pathAmpX = 0, pathAmpY = 0;
            const moveSpeedX = 0.28, moveSpeedY = 0.35;
            let movePhase = 1.8;

            let stars = [];
            const STAR_COUNT = 200;
            let electrons = [];
            let protons = [];
            const nucleusBaseRadius = 28;

            // ----- 3D функции -----
            function rotateX(p, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return { x: p.x, y: p.y * cos - p.z * sin, z: p.y * sin + p.z * cos };
            }
            function rotateY(p, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return { x: p.x * cos + p.z * sin, y: p.y, z: -p.x * sin + p.z * cos };
            }
            function rotateZ(p, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return { x: p.x * cos - p.y * sin, y: p.x * sin + p.y * cos, z: p.z };
            }
            function project(p, focalLength = 380) {
                const z = p.z + 180;
                const scale = focalLength / (focalLength + z);
                return { x: p.x * scale, y: p.y * scale, scale: scale };
            }

            function generateElectrons(z) {
                const list = [];
                const colors = ["#7affb8", "#ffbc74", "#9ab5ff", "#e094ff", "#6ec8ff", "#ffa47a", "#c08eff"];
                for (let i = 0; i < z; i++) {
                    let shell = Math.floor(i / 9);
                    let baseR = 48 + shell * 20;
                    let radius = baseR + (Math.sin(i * 17) * 7) + (Math.random() - 0.5) * 6;
                    radius = Math.min(170, Math.max(45, radius));
                    let speed = 1.0 + Math.random() * 1.2;
                    let color = colors[Math.min(shell, colors.length-1)];
                    let rotX = Math.random() * Math.PI * 2;
                    let rotY = Math.random() * Math.PI * 2;
                    let rotZ = Math.random() * Math.PI * 2;
                    let angle = Math.random() * Math.PI * 2;
                    list.push({ radius, speed, angle, color, rotX, rotY, rotZ, size: 4.6 + Math.random() * 1.3 });
                }
                return list;
            }

            function generateProtons(z) {
                const list = [];
                for (let i = 0; i < z; i++) {
                    let radius = 8 + Math.random() * 13;
                    let speed = 2.2 + Math.random() * 1.8;
                    let rotX = Math.random() * Math.PI * 2;
                    let rotY = Math.random() * Math.PI * 2;
                    let rotZ = Math.random() * Math.PI * 2;
                    let angle = Math.random() * Math.PI * 2;
                    list.push({ radius, speed, angle, color: "#ffae66", rotX, rotY, rotZ, size: 3.0 + Math.random() * 1.3 });
                }
                return list;
            }

            function rebuildAtom(z) {
                electrons = generateElectrons(z);
                protons = generateProtons(z);
            }

            function updateElementInfo(z) {
                const element = elementsMap.get(z);
                const nameSpan = document.getElementById('elementName');
                const infoSpan = document.getElementById('atomInfo');
                if (nameSpan) nameSpan.innerHTML = element ? `${element.symbol} · ${element.name}` : `Элемент №${z}`;
                if (infoSpan) infoSpan.innerHTML = element 
                    ? `⚛️ Z = ${element.Z} | ${element.symbol} | протоны: ${element.Z} | электроны: ${element.Z}`
                    : `⚛️ Z = ${z} | протонов: ${z} | электронов: ${z}`;
            }

            function switchElement(z) {
                if (z === currentZ) return;
                currentZ = z;
                rebuildAtom(z);
                updateElementInfo(z);
                highlightActiveElement(z);
                globalTime = globalTime % (Math.PI * 2);
            }

            function highlightActiveElement(z) {
                const cards = document.querySelectorAll('.element-card');
                cards.forEach(card => {
                    const cardZ = parseInt(card.getAttribute('data-z'));
                    if (cardZ === z) card.classList.add('active');
                    else card.classList.remove('active');
                });
            }

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random(), y: Math.random(),
                        radius: 0.5 + Math.random() * 1.5,
                        alphaBase: 0.04 + Math.random() * 0.12,
                        twinkleSpeed: 0.3 + Math.random() * 1.2,
                        twinklePhase: Math.random() * Math.PI * 2,
                        colorHue: 35 + Math.random() * 30
                    });
                }
            }

            function resizeCanvas() {
                const container = document.querySelector('.atom-container');
                width = container.clientWidth;
                height = container.clientHeight;
                canvas.width = width * pixelRatio;
                canvas.height = height * pixelRatio;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(pixelRatio, pixelRatio);
                
                pathAmpX = Math.min(width * 0.26, 210);
                pathAmpY = Math.min(height * 0.24, 170);
                if (pathAmpX < 45) pathAmpX = 45;
                if (pathAmpY < 40) pathAmpY = 40;
            }

            function drawBackground(now) {
                const grad = ctx.createLinearGradient(0, 0, width * 0.5, height);
                grad.addColorStop(0, '#010205');
                grad.addColorStop(1, '#020307');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                
                for (let s of stars) {
                    let twinkle = 0.6 + 0.4 * Math.sin(now * s.twinkleSpeed + s.twinklePhase);
                    let alpha = s.alphaBase * (0.4 + 0.6 * twinkle);
                    let starX = s.x * width;
                    let starY = s.y * height;
                    let rad = s.radius + 0.1 * Math.sin(now * 1.2 + s.twinklePhase);
                    ctx.beginPath();
                    ctx.arc(starX, starY, rad, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${s.colorHue}, 30%, 45%, ${alpha * 0.3})`;
                    ctx.fill();
                }
            }

            function drawNucleus(x, y, now) {
                ctx.save();
                ctx.translate(x, y);
                let pulse = 0.94 + 0.06 * Math.sin(now * 6.2);
                let rad = nucleusBaseRadius * pulse;
                const gradCore = ctx.createRadialGradient(-5, -5, 5, 0, 0, rad);
                gradCore.addColorStop(0, '#ffdd9e');
                gradCore.addColorStop(0.7, '#e09344');
                gradCore.addColorStop(1, '#aa5920');
                ctx.beginPath();
                ctx.arc(0, 0, rad, 0, Math.PI * 2);
                ctx.fillStyle = gradCore;
                ctx.shadowBlur = 11;
                ctx.shadowColor = '#cc8844';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-2, -2, rad * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 240, 180, 0.8)';
                ctx.fill();
                ctx.restore();
            }

            function drawProtons(x, y, now) {
                if (!protons.length) return;
                ctx.save();
                ctx.translate(x, y);
                for (let p of protons) {
                    let angle = p.angle + now * p.speed;
                    let local = { x: Math.cos(angle) * p.radius, y: Math.sin(angle) * p.radius, z: 0 };
                    let rotated = rotateX(local, p.rotX + now * 0.09);
                    rotated = rotateY(rotated, p.rotY + now * 0.07);
                    rotated = rotateZ(rotated, p.rotZ + now * 0.05);
                    const proj = project(rotated, 360);
                    const scale = proj.scale;
                    const size = p.size * (0.6 + 0.5 * scale);
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(proj.x - 0.7, proj.y - 0.7, size * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffe0a0";
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawElectrons(x, y, now) {
                if (!electrons.length) return;
                ctx.save();
                ctx.translate(x, y);
                for (let e of electrons) {
                    let angle = e.angle + now * e.speed;
                    let local = { x: Math.cos(angle) * e.radius, y: Math.sin(angle) * e.radius, z: 0 };
                    let rotX = e.rotX + now * 0.025;
                    let rotY = e.rotY + now * 0.018;
                    let rotZ = e.rotZ + now * 0.012;
                    let rotated = rotateX(local, rotX);
                    rotated = rotateY(rotated, rotY);
                    rotated = rotateZ(rotated, rotZ);
                    const proj = project(rotated, 360);
                    const scale = proj.scale;
                    const size = e.size * (0.65 + 0.5 * scale);
                    let trailAngle = angle - 0.12;
                    let trailLocal = { x: Math.cos(trailAngle) * e.radius, y: Math.sin(trailAngle) * e.radius, z: 0 };
                    let trailRot = rotateX(trailLocal, rotX);
                    trailRot = rotateY(trailRot, rotY);
                    trailRot = rotateZ(trailRot, rotZ);
                    const trailProj = project(trailRot, 360);
                    ctx.beginPath();
                    ctx.arc(trailProj.x, trailProj.y, size * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = e.color + '99';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = e.color;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(proj.x - 0.6 * scale, proj.y - 0.6 * scale, size * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffdd";
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawSoftGlow(x, y) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createRadialGradient(x, y, 12, x, y, 110);
                grad.addColorStop(0, 'rgba(60, 110, 180, 0.03)');
                grad.addColorStop(1, 'rgba(10, 15, 30, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 115, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function updateAtomPosition(nowTime) {
                let t = nowTime * 0.42;
                let offsetX = Math.sin(t * moveSpeedX) * pathAmpX;
                let offsetY = Math.cos(t * moveSpeedY + movePhase) * pathAmpY;
                offsetX += Math.sin(t * 1.22) * (pathAmpX * 0.1);
                offsetY += Math.cos(t * 1.51) * (pathAmpY * 0.08);
                const centerX = width / 2;
                const centerY = height / 2;
                let newX = centerX + offsetX;
                let newY = centerY + offsetY;
                const margin = 60;
                newX = Math.min(Math.max(newX, margin), width - margin);
                newY = Math.min(Math.max(newY, margin + 10), height - margin);
                atomX = newX;
                atomY = newY;
            }

            function animate(currentTime) {
                if (!lastTimestamp) lastTimestamp = currentTime;
                let delta = Math.min(0.033, (currentTime - lastTimestamp) / 1000);
                if (delta < 0.01) delta = 0.016;
                lastTimestamp = currentTime;
                globalTime += delta * 1.05;
                
                updateAtomPosition(globalTime);
                drawBackground(currentTime / 500);
                drawSoftGlow(atomX, atomY);
                drawElectrons(atomX, atomY, globalTime);
                drawNucleus(atomX, atomY, globalTime);
                drawProtons(atomX, atomY, globalTime);
                
                ctx.font = `500 ${Math.floor(nucleusBaseRadius * 0.6)}px "Segoe UI", monospace`;
                ctx.fillStyle = "#ffeaca";
                ctx.shadowBlur = 0;
                ctx.fillText(`${currentZ}`, atomX - 7, atomY + 5);
                
                animationId = requestAnimationFrame(animate);
            }

            // ----- ПОСТРОЕНИЕ ОРИГИНАЛЬНОЙ ТАБЛИЦЫ МЕНДЕЛЕЕВА -----
            function buildPeriodicTable() {
                const container = document.getElementById('periodicGrid');
                if (!container) return;
                container.innerHTML = '';
                
                // Группировка по периодам (1-7)
                const periods = {};
                for (let el of elementsData) {
                    if (!periods[el.period]) periods[el.period] = {};
                    periods[el.period][el.group] = el;
                }
                
                // Максимальная группа для каждого периода
                for (let p = 1; p <= 7; p++) {
                    const row = document.createElement('div');
                    row.className = 'period-row';
                    
                    // Номер периода
                    const periodNum = document.createElement('div');
                    periodNum.className = 'period-row-title';
                    periodNum.textContent = p;
                    row.appendChild(periodNum);
                    
                    // Группы 1-18
                    for (let g = 1; g <= 18; g++) {
                        const el = periods[p] ? periods[p][g] : null;
                        if (el) {
                            const card = document.createElement('div');
                            card.className = 'element-card';
                            card.setAttribute('data-z', el.Z);
                            card.innerHTML = `<div class="element-symbol">${el.symbol}</div><div class="element-number">${el.Z}</div>`;
                            card.addEventListener('click', (function(z){ return function(){ switchElement(z); }; })(el.Z));
                            row.appendChild(card);
                        } else {
                            // Пустая ячейка для отсутствующих элементов
                            const empty = document.createElement('div');
                            empty.className = 'empty-cell';
                            row.appendChild(empty);
                        }
                    }
                    container.appendChild(row);
                }
                
                // Строка лантаноидов
                const lanthRow = document.createElement('div');
                lanthRow.className = 'lanthanide-row';
                const lanthLabel = document.createElement('div');
                lanthLabel.className = 'lanthanide-label';
                lanthLabel.textContent = 'Лантаноиды';
                lanthRow.appendChild(lanthLabel);
                for (let el of lanthanides) {
                    const card = document.createElement('div');
                    card.className = 'element-card';
                    card.setAttribute('data-z', el.Z);
                    card.innerHTML = `<div class="element-symbol">${el.symbol}</div><div class="element-number">${el.Z}</div>`;
                    card.addEventListener('click', (function(z){ return function(){ switchElement(z); }; })(el.Z));
                    lanthRow.appendChild(card);
                }
                container.appendChild(lanthRow);
                
                // Строка актиноидов
                const actinRow = document.createElement('div');
                actinRow.className = 'actinide-row';
                const actinLabel = document.createElement('div');
                actinLabel.className = 'actinide-label';
                actinLabel.textContent = 'Актиноиды';
                actinRow.appendChild(actinLabel);
                for (let el of actinides) {
                    const card = document.createElement('div');
                    card.className = 'element-card';
                    card.setAttribute('data-z', el.Z);
                    card.innerHTML = `<div class="element-symbol">${el.symbol}</div><div class="element-number">${el.Z}</div>`;
                    card.addEventListener('click', (function(z){ return function(){ switchElement(z); }; })(el.Z));
                    actinRow.appendChild(card);
                }
                container.appendChild(actinRow);
            }

            // ----- СТАРТ -----
            function start() {
                initStars();
                buildPeriodicTable();
                resizeCanvas();
                rebuildAtom(1);
                updateElementInfo(1);
                highlightActiveElement(1);
                currentZ = 1;
                atomX = 200;
                atomY = 150;
                window.addEventListener('resize', () => {
                    resizeCanvas();
                    updateAtomPosition(globalTime);
                });
                animationId = requestAnimationFrame(animate);
            }
            
            start();
        })();
    </script>
</body>
